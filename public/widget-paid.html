<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FEthink Lesson Designer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #ffffff;
      color: #111;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
    }

    .card {
      border: 1px solid #eee;
      border-radius: 14px;
      padding: 16px;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }

    .title {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .title h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 800;
      letter-spacing: 0.2px;
    }
    .tier-pill {
      font-size: 12px;
      color: #fff;
      background: #6F2DBD;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }
    @media (max-width: 820px) {
      .row { grid-template-columns: 1fr; }
    }

    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin-bottom: 6px;
      font-weight: 700;
    }

    select, textarea, input[type="text"] {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
      background: #fff;
    }
    select:focus, textarea:focus, input[type="text"]:focus {
      border-color: #6F2DBD;
      box-shadow: 0 0 0 3px rgba(111,45,189,0.12);
    }

    textarea {
      min-height: 88px; /* ~3 lines */
      resize: vertical;
      line-height: 1.35;
    }

    /* Activity buttons */
    .activity-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
    }
    .act-btn {
      border: 1px solid #ddd;
      background: #fafafa;
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
    }
    .act-btn:hover { border-color: #bbb; }
    .act-btn.active {
      background: rgba(111,45,189,0.10);
      border-color: #6F2DBD;
      color: #2b1252;
      font-weight: 800;
    }

    /* Mode buttons */
    .mode-wrap { margin-top: 10px; }
    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 820px) {
      .mode-grid { grid-template-columns: 1fr; }
    }
    .mode-btn {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 14px;
      padding: 12px;
      cursor: pointer;
      text-align: left;
    }
    .mode-btn:hover { border-color: #bbb; }
    .mode-btn.active {
      border-color: #6F2DBD;
      box-shadow: 0 0 0 3px rgba(111,45,189,0.12);
    }
    .mode-name {
      font-weight: 900;
      font-size: 13px;
      margin: 0 0 6px 0;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .mode-sub {
      font-size: 12px;
      color: #666;
      margin: 0;
      line-height: 1.25;
    }
    .mode-tag {
      font-size: 11px;
      background: #f2f2f2;
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: 800;
      color: #333;
    }

    /* Quality lenses */
    .lens-wrap { margin-top: 12px; }
    .lens-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 820px) {
      .lens-grid { grid-template-columns: 1fr; }
    }
    .lens {
      border: 1px solid #eee;
      border-radius: 12px;
      padding: 10px;
      background: #fafafa;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .lens input { margin-top: 2px; }
    .lens b { font-size: 12px; }
    .lens small { display: block; color: #666; margin-top: 4px; line-height: 1.25; }

    /* Actions row */
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
    }
    .btn {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-weight: 800;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { border-color: #bbb; }
    .btn-primary {
      background: #6F2DBD;
      border-color: #6F2DBD;
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(0.98); }
    .btn-muted {
      background: #f6f6f6;
    }

    /* Usage */
    .usage {
      margin-top: 10px;
      font-size: 12px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .bar {
      width: 200px;
      height: 8px;
      border-radius: 999px;
      background: #eee;
      overflow: hidden;
    }
    .bar > div {
      height: 100%;
      width: 0%;
      background: #6F2DBD;
    }

    /* Chat output */
    #chat {
      margin-top: 14px;
    }

    .msg {
      margin: 16px 0;
      line-height: 1.5;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }
    .msg:last-child { border-bottom: none; }

    .user-line b, .ai-header b { color: #333; }

    .ai-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }
    .ai-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-btn {
      border: 1px solid #ddd;
      background: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 800;
    }
    .mini-btn:hover { border-color: #bbb; }

    .save-btn {
      background: #2f2f2f;
      color: #fff;
      border-color: #2f2f2f;
    }
    .save-btn:hover {
      background: #d8d8d8;
      color: #000;
      border-color: #d8d8d8;
    }

    .ppt-btn {
      background: #0a0a0a;
      color: #fff;
      border-color: #0a0a0a;
    }
    .ppt-btn:hover { opacity: 0.9; }

    /* Reply formatting */
    .ai-content { font-size: 14px; }
    .ai-h { font-weight: 900; margin: 10px 0 6px 0; }
    .ai-gap { height: 8px; }

    /* Presentation options row (theme + logo) */
    .present-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    .present-row .field {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #555;
      font-weight: 800;
    }
    .present-row select {
      width: auto;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 12px;
    }
    .present-row input[type="file"] {
      font-size: 12px;
    }
    #logoStatus {
      font-size: 12px;
      color: #666;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="title">
        <h1>Lesson Designer</h1>
        <div class="tier-pill" id="tierPill">EXPLORER</div>
      </div>

      <div class="row">
        <div>
          <label for="subject">Subject</label>
          <select id="subject"></select>
        </div>

        <div>
          <label>Activity type (choose one)</label>
          <div class="activity-grid" id="activityGrid"></div>
          <div style="font-size:12px;color:#666;margin-top:6px;">
            Selected: <b id="activitySelected">None</b>
          </div>
        </div>
      </div>

      <div class="mode-wrap">
        <label>Output mode</label>
        <div class="mode-grid" id="modeGrid"></div>
      </div>

      <div class="lens-wrap">
        <label>Quality lenses (optional)</label>
        <div class="lens-grid" id="lensGrid"></div>
      </div>

      <div style="margin-top:12px;">
        <label for="input">Your request</label>
        <textarea id="input" placeholder="Type what you want the Lesson Designer to produce…"></textarea>
      </div>

      <div class="actions">
        <button class="btn btn-primary" id="sendBtn">Send</button>
        <button class="btn btn-muted" id="clearBtn">Clear</button>
      </div>

      <!-- Presentation options -->
      <div class="present-row">
        <div class="field">
          Slide theme:
          <select id="pptTheme">
            <option value="light" selected>Light</option>
            <option value="dark">Dark</option>
          </select>
        </div>

        <div class="field">
          School logo:
          <input id="logoInput" type="file" accept="image/png,image/jpeg" />
          <span id="logoStatus">No logo uploaded</span>
        </div>
      </div>

      <div class="usage">
        <span id="usageText">Usage: <b id="usedCount">0</b>/<b id="limitCount">0</b></span>
        <div class="bar" aria-hidden="true"><div id="usageBar"></div></div>
        <span id="usageNote"></span>
      </div>

      <div id="chat"></div>
    </div>
  </div>

  <script>
    // -------------------- Tier + token from Payhip embed --------------------
    const tier = (window.FETHINK_TIER || "explorer").toString().toLowerCase();
    const token = (window.FETHINK_TOKEN || "").toString().trim();

    // UI labels
    const tierPill = document.getElementById("tierPill");
    tierPill.textContent = tier.toUpperCase();

    // -------------------- DOM --------------------
    const subjectEl = document.getElementById("subject");
    const activityGrid = document.getElementById("activityGrid");
    const activitySelectedEl = document.getElementById("activitySelected");
    const modeGrid = document.getElementById("modeGrid");
    const lensGrid = document.getElementById("lensGrid");
    const input = document.getElementById("input");
    const chat = document.getElementById("chat");

    const usedCount = document.getElementById("usedCount");
    const limitCount = document.getElementById("limitCount");
    const usageBar = document.getElementById("usageBar");
    const usageNote = document.getElementById("usageNote");

    // -------------------- Lists (Subjects A–Z) --------------------
    const subjects = [
      "Art & Design",
      "Biology",
      "Business",
      "Chemistry",
      "Construction",
      "Engineering",
      "English",
      "Employability",
      "Environmental Science",
      "Health & Social Care",
      "Hair & Beauty",
      "History",
      "Maths",
      "Motor Vehicle",
      "Public Services",
      "Psychology",
      "Sociology",
      "Special Educational Needs",
      "Travel & Tourism"
    ].sort((a,b)=>a.localeCompare(b));

    // Activities as buttons (A–Z)
    // Includes Full Lesson + your set + new additions (field trip, progress review, presentation slides, learning game, cpd activity)
    const activities = [
      "10-minute tasks",
      "Assessment Task",
      "Blended Learning",
      "CPD Activity",
      "Field Trip",
      "Group Activity",
      "Icebreaker",
      "Learning Game",
      "Lesson Closer",
      "Lesson Plan",
      "Practice Tasks",
      "Presentation Slides",
      "Progress Review",
      "Questioning",
      "Research Project",
      "Revision Support",
      "Scheme of Work",
      "Theory Class",
      "Full Lesson"
    ].sort((a,b)=>a.localeCompare(b));

    // Modes
    const modes = [
      {
        key: "standard",
        name: "Standard output",
        tag: "Fast",
        sub: "One high-quality teaching resource based on your subject + activity."
      },
      {
        key: "teacher_pack",
        name: "Teacher pack",
        tag: "Artefacts",
        sub: "Outputs learning outcomes + slides + handout + assessment materials (ready to use)."
      },
      {
        key: "assessment_pack",
        name: "Assessment & marking pack",
        tag: "Rigorous",
        sub: "Assessment tasks + success criteria + mark scheme + feedback bank + moderation notes."
      }
    ];

    // Quality lenses (4)
    const lenses = [
      {
        key: "accessibility",
        title: "Accessibility & inclusion",
        desc: "Adjusts reading level, chunking, scaffolds, SEND-friendly options, and clear instructions."
      },
      {
        key: "challenge",
        title: "Stretch & challenge",
        desc: "Adds higher-order thinking, extension prompts, and deeper conceptual questions."
      },
      {
        key: "assessment",
        title: "Assessment quality",
        desc: "Tightens success criteria, checks validity, adds retrieval/hinge questions and misconceptions."
      },
      {
        key: "practicality",
        title: "Practical classroom delivery",
        desc: "Ensures timing, resources, routines, differentiation, and realistic teacher workload."
      }
    ];

    // -------------------- State --------------------
    let selectedActivity = "";
    let selectedMode = "standard";
    const selectedLenses = new Set();

    // PPT options
    let logoDataUrl = null;

    // -------------------- Populate subjects --------------------
    function fillSubjects() {
      subjectEl.innerHTML = "";
      for (const s of subjects) {
        const opt = document.createElement("option");
        opt.value = s;
        opt.textContent = s;
        subjectEl.appendChild(opt);
      }
      // Default
      subjectEl.value = "Sociology";
    }

    // -------------------- Activity buttons --------------------
    function fillActivities() {
      activityGrid.innerHTML = "";
      activities.forEach(a => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "act-btn";
        b.textContent = a;
        b.onclick = () => {
          selectedActivity = a;
          [...activityGrid.querySelectorAll(".act-btn")].forEach(x => x.classList.remove("active"));
          b.classList.add("active");
          activitySelectedEl.textContent = a;
        };
        activityGrid.appendChild(b);
      });

      // pick a sensible default
      const defaultAct = "Lesson Plan";
      const btns = [...activityGrid.querySelectorAll(".act-btn")];
      const found = btns.find(x => x.textContent === defaultAct) || btns[0];
      found.click();
    }

    // -------------------- Modes --------------------
    function fillModes() {
      modeGrid.innerHTML = "";
      modes.forEach(m => {
        const d = document.createElement("div");
        d.className = "mode-btn";
        d.innerHTML = `
          <div class="mode-name">${m.name} <span class="mode-tag">${m.tag}</span></div>
          <p class="mode-sub">${m.sub}</p>
        `;
        d.onclick = () => {
          selectedMode = m.key;
          [...modeGrid.querySelectorAll(".mode-btn")].forEach(x => x.classList.remove("active"));
          d.classList.add("active");
        };
        modeGrid.appendChild(d);
      });
      // default
      modeGrid.querySelectorAll(".mode-btn")[0].classList.add("active");
    }

    // -------------------- Lenses --------------------
    function fillLenses() {
      lensGrid.innerHTML = "";
      lenses.forEach(l => {
        const wrap = document.createElement("div");
        wrap.className = "lens";
        wrap.innerHTML = `
          <input type="checkbox" id="lens_${l.key}" />
          <div>
            <b>${l.title}</b>
            <small>${l.desc}</small>
          </div>
        `;
        const cb = wrap.querySelector("input");
        cb.onchange = () => {
          if (cb.checked) selectedLenses.add(l.key);
          else selectedLenses.delete(l.key);
        };
        lensGrid.appendChild(wrap);
      });
    }

    // -------------------- Logo upload handling --------------------
    const logoInput = document.getElementById("logoInput");
    const logoStatus = document.getElementById("logoStatus");

    if (logoInput) {
      logoInput.addEventListener("change", () => {
        const file = logoInput.files && logoInput.files[0];
        if (!file) {
          logoDataUrl = null;
          logoStatus.textContent = "No logo uploaded";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          logoDataUrl = reader.result; // data:image/png;base64,...
          logoStatus.textContent = `Logo loaded: ${file.name}`;
        };
        reader.readAsDataURL(file);
      });
    }

    // -------------------- Prompt builders --------------------
    function activityPreset(activity) {
      // Ensures activities lead to genuinely different outputs
      const presets = {
        "Lesson Plan": "Create a complete lesson plan with timings, teacher script prompts, and differentiation.",
        "Scheme of Work": "Create a mini scheme of work (4 lessons) with sequencing, retrieval and assessment points.",
        "Assessment Task": "Create an assessment task with success criteria, mark scheme and common misconceptions.",
        "Blended Learning": "Design a blended lesson with online + classroom phases and clear instructions for students.",
        "Questioning": "Create a questioning plan: hinge questions, cold-call prompts, and misconception checks.",
        "Group Activity": "Design a structured group activity with roles, resources, and accountability checks.",
        "Revision Support": "Create a revision pack: retrieval questions, model answers, and spacing schedule.",
        "Theory Class": "Design a theory-heavy session with explanations, examples, checks for understanding and practice.",
        "Icebreaker": "Create a quick icebreaker linked to the topic (not generic), with steps and timings.",
        "Lesson Closer": "Create a purposeful lesson closer with reflection, synthesis and an exit-check.",
        "Practice Tasks": "Create a set of practice tasks (easy→hard), including answers and scaffolds.",
        "Research Project": "Design a research project brief with milestones, sources guidance and rubric.",
        "10-minute tasks": "Create 3 x 10-minute micro-activities that work mid-lesson, each with steps + outputs.",
        "Field Trip": "Create a field trip plan: objectives, itinerary, risk considerations, tasks and follow-up assessment.",
        "Progress Review": "Create a progress review activity: evidence prompts, targets, and a short action plan template.",
        "Presentation Slides": "Create a slide deck outline with slide-by-slide content and speaker notes.",
        "Learning Game": "Create a learning game (classroom-safe) with rules, resources and learning checks.",
        "CPD Activity": "Create a CPD activity for staff: objectives, facilitation steps, materials and reflection prompts.",
        "Full Lesson": "Create a full lesson package: outcomes, lesson plan, slides outline with speaker notes, handout, and assessment exit task."
      };
      return presets[activity] || "Create a high-quality teaching resource aligned to the chosen activity type.";
    }

    function lensesBlock() {
      if (!selectedLenses.size) return "";
      const mapping = {
        accessibility: "Accessibility & inclusion: chunk instructions; plain English; SEND-friendly scaffolds; alternative ways to respond.",
        challenge: "Stretch & challenge: add higher-order questions; extension; deepen conceptual understanding.",
        assessment: "Assessment quality: hinge questions; misconceptions; clear success criteria; valid checks for learning.",
        practicality: "Practical delivery: realistic timings; minimal prep; classroom management steps; resources list."
      };
      const lines = [...selectedLenses].map(k => `- ${mapping[k] || k}`);
      return `QUALITY LENSES (apply):\n${lines.join("\n")}\n`;
    }

    function modeRules(modeKey) {
      // These ensure Teacher Pack and Assessment Pack produce genuinely different, premium artefacts.
      if (modeKey === "teacher_pack") {
        return `
OUTPUT MODE: TEACHER PACK
You MUST produce these sections, clearly separated:
1) Learning Outcomes (3–5, measurable)
2) Teacher-facing lesson plan (timed steps)
3) Student handout (print-ready content)
4) Assessment component (task + success criteria)
5) Slides (PowerPoint-ready) using EXACT structure:
   Slide 1: Title
   - bullet
   - bullet
   Speaker notes: ...
   Slide 2: ...
6) Homework / extension
Rules:
- Keep language FE/HE appropriate and practical.
- Avoid long paragraphs; use headings and bullets.
- Make the handout visually spaced (short blocks, clear headings).
`;
      }

      if (modeKey === "assessment_pack") {
        return `
OUTPUT MODE: ASSESSMENT & MARKING PACK
You MUST produce these sections:
1) Assessment task (clear brief)
2) Success criteria (student-friendly)
3) Mark scheme / rubric (levels + descriptors)
4) Model answer or exemplars (short but high-quality)
5) Feedback bank (ready-to-use phrases)
6) Misconceptions + how to address them
7) Moderation notes (fairness, bias checks, consistency)
Rules:
- Keep language plain but rigorous.
- Make it easy to copy into a VLE or print.
`;
      }

      return `
OUTPUT MODE: STANDARD
Produce one strong resource aligned to the activity type, with:
- Title
- Purpose (1 sentence)
- Steps / guidance (bullets)
- Differentiation
- Quick check for understanding
`;
    }

    function buildPrompt(userQuestion) {
      const subject = subjectEl.value;
      const activity = selectedActivity || "Lesson Plan";
      const preset = activityPreset(activity);

      // System-style rules (kept out of student view; used only for AI)
      const globalRules = `
You are FEthink Lesson Designer for UK FE/HE educators.
GLOBAL RESPONSE RULES:
- Use clear headings (## or ###)
- Use bullet points where appropriate
- Keep language plain and accessible
- Avoid long paragraphs
- Make outputs ready to use in teaching
`;

      const lens = lensesBlock();
      const mode = modeRules(selectedMode);

      return `${globalRules}
CONTEXT:
Subject: ${subject}
Activity type: ${activity}

TASK:
${preset}

${lens}
${mode}

USER REQUEST:
${userQuestion}
`;
    }

    // -------------------- Formatting helpers --------------------
    function escapeHtml(s) {
      return (s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatReplyToHtml(raw) {
      // raw is already escaped
      return raw
        .replace(/^### (.*)$/gm, `<div class="ai-h">$1</div>`)
        .replace(/^## (.*)$/gm, `<div class="ai-h">$1</div>`)
        .replace(/^# (.*)$/gm, `<div class="ai-h">$1</div>`)
        .replace(/\n{2,}/g, `<div class="ai-gap"></div>`)
        .replace(/\n/g, "<br>");
    }

    // -------------------- Artefact detection (Slides for PPT) --------------------
    function extractSlidesTextFromReply(replyText) {
      // Try to locate slide structure "Slide 1:" onward.
      const idx = replyText.search(/^\s*Slide\s+1\b/im);
      if (idx >= 0) return replyText.slice(idx).trim();
      // fallback: if no explicit slides, still pass whole text (server will reject if it can't parse)
      return replyText.trim();
    }

    // -------------------- Buttons actions on AI card --------------------
    function copyAIResponse(btn) {
      const msg = btn.closest(".ai-msg");
      const content = msg.querySelector(".ai-content");
      const text = content.innerText || "";
      navigator.clipboard.writeText(text);
      btn.textContent = "Copied";
      setTimeout(() => (btn.textContent = "Copy"), 900);
    }

    function saveAIResponse(btn) {
      const msg = btn.closest(".ai-msg");
      const content = msg.querySelector(".ai-content");
      const text = content.innerText || "";
      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `FEthink-response-${new Date().toISOString().slice(0,10)}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function downloadWord(btn) {
      const msg = btn.closest(".ai-msg");
      const content = msg.querySelector(".ai-content");
      // Basic Word-compatible HTML .doc export
      const html = `
        <html><head><meta charset="utf-8"></head>
        <body style="font-family:Calibri,Arial,sans-serif; line-height:1.4;">
        ${content.innerHTML}
        </body></html>
      `;
      const blob = new Blob([html], { type: "application/msword" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `FEthink-resource-${new Date().toISOString().slice(0,10)}.doc`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function downloadPptxFromSlides(btn, rawReplyText, subtitle) {
      const old = btn.textContent;
      btn.textContent = "Building…";
      btn.disabled = true;

      try {
        const slidesText = extractSlidesTextFromReply(rawReplyText);
        const theme = (document.getElementById("pptTheme")?.value || "light");

        const res = await fetch("/pptx", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            tier,
            token,
            slidesText,
            deckTitle: "FEthink – Lesson Slides",
            subtitle: subtitle || "",
            theme,
            logoDataUrl
          })
        });

        if (!res.ok) {
          let msg = "PPT export failed.";
          try {
            const j = await res.json();
            if (j && (j.error || j.reply)) msg = j.error || j.reply;
          } catch {}
          alert(msg);
          return;
        }

        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `FEthink-slides-${new Date().toISOString().slice(0,10)}.pptx`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } finally {
        btn.textContent = old;
        btn.disabled = false;
      }
    }

    function renderAIMessage(reply, meta) {
      const safe = escapeHtml(reply || "");
      const formatted = formatReplyToHtml(safe);

      const wrapper = document.createElement("div");
      wrapper.className = "msg ai-msg";
      wrapper.dataset.raw = reply || "";

      const header = document.createElement("div");
      header.className = "ai-header";

      const left = document.createElement("div");
      left.innerHTML = `<b>AI:</b>`;

      const actions = document.createElement("div");
      actions.className = "ai-actions";

      const copyBtn = document.createElement("button");
      copyBtn.className = "mini-btn copy-btn";
      copyBtn.textContent = "Copy";
      copyBtn.onclick = () => copyAIResponse(copyBtn);

      const saveBtn = document.createElement("button");
      saveBtn.className = "mini-btn save-btn";
      saveBtn.textContent = "Save";
      saveBtn.onclick = () => saveAIResponse(saveBtn);

      const wordBtn = document.createElement("button");
      wordBtn.className = "mini-btn word-btn";
      wordBtn.textContent = "Word";
      wordBtn.onclick = () => downloadWord(wordBtn);

      actions.appendChild(copyBtn);
      actions.appendChild(saveBtn);
      actions.appendChild(wordBtn);

      // PPT only when the reply contains slides
      const isSlides = /^\s*Slide\s+1\b/im.test(reply || "");
      if (isSlides) {
        const pptBtn = document.createElement("button");
        pptBtn.className = "mini-btn ppt-btn";
        pptBtn.textContent = "PPT";
        pptBtn.onclick = () => downloadPptxFromSlides(pptBtn, (wrapper.dataset.raw || ""), meta || "");
        actions.appendChild(pptBtn);
      }

      header.appendChild(left);
      header.appendChild(actions);

      const content = document.createElement("div");
      content.className = "ai-content";
      content.innerHTML = formatted;

      wrapper.appendChild(header);
      wrapper.appendChild(content);
      chat.appendChild(wrapper);
    }

    function renderUserMessage(text) {
      const div = document.createElement("div");
      div.className = "msg user-line";
      div.innerHTML = `<b>You:</b> ${escapeHtml(text)}`;
      chat.appendChild(div);
    }

    // -------------------- Usage UI --------------------
    function updateUsageUI(used, limit) {
      if (typeof used !== "number" || typeof limit !== "number" || limit <= 0) {
        usedCount.textContent = "0";
        limitCount.textContent = "0";
        usageBar.style.width = "0%";
        usageNote.textContent = "";
        return;
      }

      usedCount.textContent = String(used);
      limitCount.textContent = String(limit);

      const pct = Math.max(0, Math.min(100, Math.round((used / limit) * 100)));
      usageBar.style.width = pct + "%";

      if (used >= limit) {
        usageNote.textContent = "Limit reached for today.";
      } else {
        usageNote.textContent = `${limit - used} remaining today.`;
      }
    }

    // -------------------- Send / Clear --------------------
    document.getElementById("sendBtn").onclick = async () => {
      const q = (input.value || "").trim();
      if (!q) return;

      const subject = subjectEl.value;
      const activity = selectedActivity || "Lesson Plan";
      const subtitle = `${subject} • ${activity}`;

      // Show user question plainly (not the hidden prompt)
      renderUserMessage(q);

      const prompt = buildPrompt(q);

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            message: prompt,
            tier,
            token
          })
        });

        const data = await res.json();
        console.log("ASK RESPONSE:", data);

        if (typeof data.used === "number" && typeof data.limit === "number") {
          updateUsageUI(data.used, data.limit);
        }

        renderAIMessage(data.reply || "Temporary error. Please try again shortly.", subtitle);
      } catch (e) {
        renderAIMessage("Temporary error. Please try again shortly.", subtitle);
      }
    };

    document.getElementById("clearBtn").onclick = () => {
      input.value = "";
      chat.innerHTML = "";
      updateUsageUI(0, 0);
    };

    // -------------------- Init --------------------
    fillSubjects();
    fillActivities();
    fillModes();
    fillLenses();
    updateUsageUI(0, 0);
  </script>
</body>
</html>
