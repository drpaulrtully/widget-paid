<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>FEthink – Lesson Designer (Paid)</title>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background: #fff;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      border: 1px solid #e6e6e6;
      border-radius: 14px;
      padding: 14px;
      background: #fff;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
    }

    .meta {
      margin: 4px 0 0 0;
      font-size: 12px;
      color: #666;
    }

    .usage {
      text-align: right;
      font-size: 12px;
      color: #444;
      white-space: nowrap;
    }

    .usage b { font-weight: 800; }

    label {
      display: block;
      font-size: 12px;
      color: #555;
      margin: 10px 0 6px;
    }

    select, textarea {
      width: 100%;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
      outline: none;
    }

    select:focus, textarea:focus {
      border-color: #6f2dbd;
      box-shadow: 0 0 0 3px rgba(111,45,189,0.12);
    }

    textarea {
      resize: vertical;
      min-height: 78px; /* ~3 lines */
      line-height: 1.4;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 600px) {
      .row { grid-template-columns: 1fr; }
      .usage { text-align: left; }
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      align-items: center;
    }

    .btn {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      cursor: pointer;
      background: #fff;
    }

    .btn-primary {
      background: #6f2dbd;
      color: #fff;
      border-color: #6f2dbd;
    }

    .btn-primary:hover { opacity: 0.92; }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #chat {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
    }

    .msg {
      margin: 16px 0;
      line-height: 1.5;
      padding-bottom: 12px;
      border-bottom: 1px solid #eee;
    }

    .msg:last-child { border-bottom: none; }

    .ai-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .ai-actions {
      display: flex;
      gap: 8px;
    }

    .mini-btn {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      background: #fff;
    }

    .save-btn {
      background: #3a3a3a;
      color: #fff;
      border-color: #3a3a3a;
    }
    .save-btn:hover { background: #d9d9d9; color: #000; border-color: #d9d9d9; }

    .copy-btn:hover { background: #f2f2f2; }

    .word-btn {
      background: #111;
      color: #fff;
      border-color: #111;
    }
    .word-btn:hover { opacity: 0.9; }

    .ai-content { margin-top: 4px; }

    /* Clean heading spacing in AI output */
    .ai-h {
      display: block;
      font-weight: 800;
      margin: 10px 0 6px 0;
    }
    .ai-gap { height: 8px; }

    .note {
      font-size: 12px;
      color: #666;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 class="title">FEthink – Lesson Designer</h1>
        <p class="meta">Paid educator assistant (Explorer / Pro)</p>
      </div>
      <div class="usage">
        Today: <b><span id="used-count">0</span></b> / <span id="limit-count">—</span>
      </div>
    </div>

    <div class="row">
      <div>
        <label for="subject">Subject</label>
        <select id="subject">
          <!-- Core + extra subjects you requested -->
          <option>Biology</option>
          <option>Business</option>
          <option>Chemistry</option>
          <option>Construction</option>
          <option>Employability</option>
          <option>Engineering</option>
          <option>English</option>
          <option>Environmental Science</option>
          <option>Hair &amp; Beauty</option>
          <option>Health &amp; Social Care</option>
          <option>History</option>
          <option>Maths</option>
          <option>Motor Vehicle</option>
          <option>Public Services</option>
          <option>Psychology</option>
          <option>Sociology</option>
          <option>Special Educational Needs</option>
          <option>Travel &amp; Tourism</option>
        </select>
      </div>

      <div>
        <label for="activity">Activity type</label>
        <select id="activity">
          <option>10-minute tasks</option>
          <option>Assessment Task</option>
          <option>Blended Learning</option>
          <option>CPD activity</option>
          <option>Field trip</option>
          <option>Group Activity</option>
          <option>Icebreaker</option>
          <option>Learning game</option>
          <option>Lesson Closer</option>
          <option>Lesson Plan</option>
          <option>Presentation slides</option>
          <option>Practice Tasks</option>
          <option>Progress review</option>
          <option>Questioning</option>
          <option>Research Project</option>
          <option>Revision Support</option>
          <option>Scheme of Work</option>
          <option>Theory Class</option>
        </select>
      </div>
    </div>

    <label for="input">What do you want to generate?</label>
    <textarea id="input" placeholder="Example: Create a 50-minute lesson plan on social class and education, with SEND scaffolds and an exit ticket."></textarea>

    <div class="actions">
      <button class="btn btn-primary" id="sendBtn">Send</button>
      <button class="btn" id="clearBtn">Clear</button>
    </div>

    <div id="chat"></div>

    <div class="note">
      Tip: Explorer = 50/day, Pro = 200/day. (Tier is set by the embed code you use in Payhip.)
    </div>
  </div>

  <script>
    // -------------------------
    // SET THESE FROM PAYHIP EMBED
    // -------------------------
    // The Payhip embed will set: window.FETHINK_TIER = "explorer" or "pro"
    // and optionally: window.FETHINK_TOKEN = "...." (if you enable tokens)
    const getTier = () => (window.FETHINK_TIER || "explorer");
    const getToken = () => (window.FETHINK_TOKEN || "");

    const input = document.getElementById("input");
    const chat = document.getElementById("chat");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");

    function escapeHTML(s) {
      return (s || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatAI(markdownText) {
      // Escape first so user content can’t inject HTML
      const safe = escapeHTML(markdownText);

      // Convert markdown-ish headings to styled blocks with controlled spacing
      return safe
        .replace(/^### (.*)$/gm, '<span class="ai-h">$1</span>')
        .replace(/^## (.*)$/gm, '<span class="ai-h">$1</span>')
        .replace(/^# (.*)$/gm, '<span class="ai-h">$1</span>')
        .replace(/\n\n/g, '<div class="ai-gap"></div>')
        .replace(/\n/g, "<br>");
    }

    function updateUsage(used, limit) {
      if (typeof used === "number") document.getElementById("used-count").textContent = used;
      if (typeof limit === "number") document.getElementById("limit-count").textContent = limit;
    }

    function copyAIResponse(btn) {
      const msg = btn.closest(".ai-msg");
      const content = msg.querySelector(".ai-content");
      const text = content.innerText;

      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "Copied";
        setTimeout(() => (btn.textContent = "Copy"), 900);
      });
    }

    function saveAIResponse(btn) {
      const msg = btn.closest(".ai-msg");
      const content = msg.querySelector(".ai-content");
      const text = content.innerText;

      const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "FEthink-response.txt";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    function downloadWord(btn) {
      const msg = btn.closest(".ai-msg");
      const content = msg.querySelector(".ai-content");
      const plain = content.innerText;

      const html =
        `<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>` +
        `<pre style="font-family:Arial; white-space:pre-wrap;">${escapeHTML(plain)}</pre>` +
        `</body></html>`;

      const blob = new Blob([html], { type: "application/msword;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "FEthink-response.doc";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function send() {
      const subject = document.getElementById("subject").value;
      const activity = document.getElementById("activity").value;
      const question = input.value.trim();
      if (!question) return;

      const tier = getTier();
      const token = getToken();

      const text = `Subject: ${subject}\nActivity: ${activity}\nUser request: ${question}`;

      chat.innerHTML += `<div class="msg"><b>You:</b> ${escapeHTML(question)}</div>`;
      input.value = "";
      sendBtn.disabled = true;

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, tier, token })
        });

        const data = await res.json();

        if (typeof data.used === "number" && typeof data.limit === "number") {
          updateUsage(data.used, data.limit);
        }

        const formattedReply = formatAI(data.reply || "");

        chat.innerHTML += `
          <div class="msg ai-msg">
            <div class="ai-header">
              <b>AI:</b>
              <div class="ai-actions">
                <button class="mini-btn copy-btn" onclick="copyAIResponse(this)">Copy</button>
                <button class="mini-btn save-btn" onclick="saveAIResponse(this)">Save</button>
                <button class="mini-btn word-btn" onclick="downloadWord(this)">Word</button>
              </div>
            </div>
            <div class="ai-content">${formattedReply}</div>
          </div>
        `;
      } catch (e) {
        chat.innerHTML += `<div class="msg"><b>AI:</b> Temporary error. Please try again shortly.</div>`;
      } finally {
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    clearBtn.addEventListener("click", () => {
      chat.innerHTML = "";
      updateUsage(0, document.getElementById("limit-count").textContent === "—" ? "—" : Number(document.getElementById("limit-count").textContent));
    });
  </script>
</body>
</html>
